services:
  postgres:
    image: postgres:16-alpine
    container_name: waypoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-waypoint_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-waypoint_cargo}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-waypoint_cargo}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - waypoint-net

  redis:
    image: redis:7-alpine
    container_name: waypoint-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - waypoint-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waypoint-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-waypoint_secure_pass_2026}@postgres:5432/${DB_NAME:-waypoint_cargo}?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - waypoint-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: waypoint-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - waypoint-net

volumes:
  postgres_data:
  redis_data:

networks:
  waypoint-net:
    driver: bridge
